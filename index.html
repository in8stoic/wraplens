<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WrapLens Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap">
<style>
:root{--bg:#0f1114;--panel:#181b20;--line:#2a2f37;--fg:#f2f3f5;--muted:#9aa3ad;--accent:#ffb000;--accent-fg:#141414;--display:"Barlow Condensed",Impact,sans-serif;--body:"Barlow",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;touch-action:none}
#video{display:none}
.top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
.top h1{margin:0;font:800 22px var(--display);text-transform:uppercase;letter-spacing:.02em}.top h1 small{display:block;font:600 10px var(--body);color:#ddd;letter-spacing:.12em}
.top .cur{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:999px;font:600 13px var(--body);max-width:55%}
.top .cur i{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.4)}.top .cur span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.6);font:500 13px var(--body);text-align:center}
.sheet{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{flex:1;background:transparent;border:0;color:var(--fg);padding:8px 2px;font:600 12px var(--body)}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.films{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.film{flex:none;width:58px;border:2px solid transparent;border-radius:8px;background:none;padding:0;color:var(--muted);text-align:left}
.film .sw{height:40px;border-radius:6px;border:1px solid rgba(0,0,0,.3)}.film span{display:block;font:500 10px/1.15 var(--body);margin-top:3px;height:24px;overflow:hidden}.film[aria-pressed=true]{border-color:var(--accent)}.film[aria-pressed=true] span{color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}.row input[type=search]{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:14px var(--body)}
input[type=range]{flex:1;accent-color:var(--accent)}label{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:11px 12px;font:700 13px var(--body);text-transform:uppercase;letter-spacing:.04em}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.start{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;background:var(--bg)}.start h2{font:800 34px var(--display);text-transform:uppercase;margin:0}.start p{color:var(--muted);margin:0;max-width:34ch}
</style></head><body>
<div id="app">
 <div id="view">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <div class="top"><h1>WrapLens<small>BY WRAPTORS · LIVE</small></h1><div class="cur"><i id="curSw"></i><span id="curName">Pick a film</span></div></div>
  <div id="msg">Tap the car's paint in 2–3 spots to lock its colour.</div><div id="segState" style="cursor:pointer;position:absolute;right:10px;bottom:40px;font:600 10px var(--body);color:#ccc;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:999px">Loading car detection…</div>
  <div class="start" id="start"><h2>Live wrap preview</h2><p>Point the camera at the car, tap the paint, pick a film. The colour changes live while you walk around.</p><button class="btn" id="go">Start camera</button><p id="err"></p></div>
 </div>
 <div class="sheet">
  <div class="seg" id="brands"><button aria-pressed="true" data-b="Avery Dennison">Avery</button><button aria-pressed="false" data-b="3M">3M</button><button aria-pressed="false" data-b="Hexis">Hexis</button><button aria-pressed="false" data-b="TeckWrap">TeckWrap</button></div>
  <div class="row"><input type="search" id="q" placeholder="Search colour or code"></div><div class="seg" id="finish"><button aria-pressed="true" data-f="gloss">Gloss</button><button aria-pressed="false" data-f="satin">Satin</button><button aria-pressed="false" data-f="matte">Matte</button></div>
  <div class="films" id="films"></div>
  <div class="row"><label>Pick-up</label><input type="range" id="tol" min="15" max="100" value="50"><button class="btn ghost" id="clear">Clear</button><button class="btn ghost" id="freeze">Freeze</button><button class="btn" id="shot">Save photo</button><button class="btn ghost" id="share">Share</button></div>
 </div>
</div>

$('#brands').onclick=e=>{const b=e.target.closest('button');if(!b)return;BRAND=b.dataset.b;[...$('#brands').children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));buildFilms();};

$('#q').oninput=e=>{Q=e.target.value.trim().toLowerCase();buildFilms();};
$('#tol').oninput=e=>tol=+e.target.value;
$('#segState').onclick=()=>{useSeg=!useSeg;if(!useSeg){segOK=false;$('#segState').textContent='Detection off · tap to turn on';}};
$('#clear').onclick=()=>{picks=[];$('#msg').textContent='Picks cleared. Tap the paint again.';};
buildFilms();

async function loadSeg(){
  let ImageSegmenter,FilesetResolver;try{({ImageSegmenter,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'));}catch(e){console.warn('mp import',e);$('#segState').textContent='Car detection unavailable, colour only';return;}
  try{const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    seg=await ImageSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite",delegate:"GPU"},runningMode:"VIDEO",outputCategoryMask:true,outputConfidenceMasks:false});
    $('#segState').textContent='Car detection on';}
  catch(e){console.warn('seg',e);try{const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    seg=await ImageSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite",delegate:"CPU"},runningMode:"VIDEO",outputCategoryMask:true});$('#segState').textContent='Car detection on (CPU)';}
    catch(e2){console.warn('seg cpu',e2);$('#segState').textContent='Car detection unavailable, colour only';}}
}
$('#go').onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream;await video.play();$('#start').remove();loadSeg();requestAnimationFrame(loop);}
  catch(e){$('#err').textContent='Camera blocked: '+e.message+'. Allow camera access for this site in your browser settings.';}
};
function fit(){const vw=video.videoWidth,vh=video.videoHeight;if(!vw)return false;if(work.width!==PW||work.height!==Math.round(PW*vh/vw)){work.width=PW;work.height=Math.round(PW*vh/vw);cv.width=work.width;cv.height=work.height;}return true;}
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
// Lab-ish distance: chromaticity (hue/sat independent of brightness) + a soft lightness term
function feat(r,g,b){const s=r+g+b+1;const L=(0.2126*r+0.7152*g+0.0722*b)/255;return[r/s,g/s,L,Math.max(r,g,b)-Math.min(r,g,b)];}
let lastFrame=null,segBusy=false,lastSegT=0;
function loop(){
  if(!frozen&&fit()){wctx.drawImage(video,0,0,work.width,work.height);lastFrame=wctx.getImageData(0,0,work.width,work.height);
    if(seg&&useSeg&&!segBusy){segBusy=true;try{const t=performance.now();if(t>lastSegT){lastSegT=t;const res=seg.segmentForVideo(work,t);const m=res.categoryMask;segW=m.width;segH=m.height;const u=m.getAsUint8Array();
      if(!segMask||segMask.length!==u.length)segMask=new Uint8Array(u.length);segMask.set(u);let n=0;for(let i=0;i<u.length;i+=7){const c=u[i];if(c===7||c===6||c===14)n++;}segOK=useSeg&&n*7>u.length*0.02;$('#segState').textContent=segOK?'Car detected · tap to turn off':(useSeg?'No car seen · colour only':'Detection off · tap to turn on');res.close();}}catch(e){console.warn(e);}segBusy=false;}}
  if(lastFrame)draw(lastFrame);
  requestAnimationFrame(loop);
}
function carAt(x,y,w,h){if(!segMask||!segW)return 1;const sx=(x*segW/w)|0,sy=(y*segH/h)|0;const c=segMask[sy*segW+sx];return(c===7||c===6||c===14)?1:0;}
function draw(frame){
  const W=frame.width,H=frame.height,src=frame.data,out=ctx.createImageData(W,H),o=out.data;o.set(src);
  if(picks.length&&film){
    const[tr,tg,tb]=hex(film[2]);const tl=(0.2126*tr+0.7152*tg+0.0722*tb)/255,lift=tl<0.18?0.12:0;
    const baseL=Math.max(.08,picks.reduce((a,p)=>a+p[2],0)/picks.length);
    const achro=picks.every(p=>p[3]<40);           // grey / black / white paint
    const T=tol/100;
    const hasSeg=!!(segMask&&segW&&segOK);
    for(let y=0;y<H;y++){const row=y*W;const sy=hasSeg?((y*segH/H)|0)*segW:0;
      for(let x=0;x<W;x++){const i=row+x;
        if(hasSeg){const c=segMask[sy+((x*segW/W)|0)];if(!(c===7||c===6||c===14))continue;}
        const r=src[i*4],g=src[i*4+1],b=src[i*4+2];const[cr,cg,L,ch]=feat(r,g,b);
        let d=9;for(const p of picks){let dd;
          if(achro){dd=Math.hypot(ch/255*2,(L-p[2])*(hasSeg?0.6:1.1));}
          else{dd=Math.hypot((cr-p[0])*5,(cg-p[1])*5,(L-p[2])*(hasSeg?0.4:0.8),(ch-p[3])/255*0.5);}
          if(dd<d)d=dd;}
        let m=1-Math.max(0,(d-T*0.5)/(T*0.5));if(m<=0.02)continue;m=Math.min(1,m);
        let k=L/baseL;
        if(finish==='matte')k=0.55+0.45*Math.min(k,1.15);else if(finish==='satin')k=0.35+0.65*Math.min(k,1.5);else{k=Math.min(k,2.2);if(k>1.35)k=1.35+(k-1.35)*1.6;}
        const lf=lift*255*(L-baseL);const nr=Math.max(0,Math.min(255,tr*k+lf)),ng=Math.max(0,Math.min(255,tg*k+lf)),nb=Math.max(0,Math.min(255,tb*k+lf));
        o[i*4]=r+(nr-r)*m;o[i*4+1]=g+(ng-g)*m;o[i*4+2]=b+(nb-b)*m;}}
  }
  ctx.putImageData(out,0,0);
}
cv.addEventListener('pointerdown',e=>{if(!lastFrame)return;const r=cv.getBoundingClientRect();
  const sc=Math.max(r.width/cv.width,r.height/cv.height),ox=(r.width-cv.width*sc)/2,oy=(r.height-cv.height*sc)/2;
  const x=Math.round((e.clientX-r.left-ox)/sc),y=Math.round((e.clientY-r.top-oy)/sc);if(x<0||y<0||x>=cv.width||y>=cv.height)return;
  let rr=0,gg=0,bb=0,n=0;const d=lastFrame.data;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=cv.width||yy>=cv.height)continue;const j=(yy*cv.width+xx)*4;rr+=d[j];gg+=d[j+1];bb+=d[j+2];n++;}
  if(segOK&&!carAt(x,y,cv.width,cv.height)){useSeg=false;segOK=false;$('#segState').textContent='Detection off · tap to turn on';}
  picks.push(feat(rr/n,gg/n,bb/n));if(picks.length>6)picks.shift();
  $('#msg').textContent=film?`${picks.length} paint sample${picks.length>1?'s':''}. Tap more spots if panels are missed; Clear to start over.`:'Colour locked. Pick a film below.';});
$('#freeze').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Resume':'Freeze';};
async function blob(){return new Promise(r=>cv.toBlob(r,'image/jpeg',.92));}
$('#shot').onclick=async()=>{const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wraplens-'+(film?film[1]:'preview').toLowerCase().replace(/\s+/g,'-')+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
$('#share').onclick=async()=>{const b=await blob();const f=new File([b],'wraplens.jpg',{type:'image/jpeg'});const text=film?`${film[1]} (${BRAND} ${film[0]}) on my car via WrapLens by Wraptors`:'WrapLens by Wraptors';
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text});}catch(e){}}else{try{await navigator.share({text,url:location.href});}catch(e){$('#msg').textContent='Sharing not available here. Use Save photo.';}}};
</script></body></html>
